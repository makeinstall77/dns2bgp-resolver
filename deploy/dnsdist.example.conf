-- dns2bgp AAAA suppress (clients → dnsdist → unbound)
-- Place in front of unbound; clients use dnsdist as resolver.
--
-- dns2bgp writes /var/lib/dns2bgp/aaaa-suppress.domains (one domain per line)
-- and reloads via /usr/lib/dns2bgp/reload-dnsdist.sh (reads /etc/dns2bgp/dnsdist.key).
--
-- Minimal dns2bgp config:
--   ipv6:
--     mode: suppress
--     dnsdist_list_path: "/var/lib/dns2bgp/aaaa-suppress.domains"
--     dnsdist_reload_enable: true
--     dnsdist_console_key_file: "/etc/dns2bgp/dnsdist.key"
--     dnsdist_reload_cmd:
--       - /usr/lib/dns2bgp/reload-dnsdist.sh
--
-- systemd: dns2bgp ExecStartPost and dnsdist ExecReload call the same helper.
--
-- IMPORTANT: SuffixMatchNodeRule() copies the tree at addAction() time.
-- Never use it with a node that reloadDns2bgpDomains() mutates — new/removed
-- names would not apply until dnsdist restart. Use LuaRule + live :check().

controlSocket('127.0.0.1:5199')
setKey('change-me-to-a-random-base64-key=')  -- dnsdist -k / generateKey()

-- Upstream recursive resolver (unbound)
newServer({address='127.0.0.1:53', name='unbound', pool=''})

-- Listen for clients (example)
addLocal('127.0.0.1:5353')

dns2bgpDomains = newSuffixMatchNode()
dns2bgpDomainSet = {}

local DNS2BGP_LIST = '/var/lib/dns2bgp/aaaa-suppress.domains'

function reloadDns2bgpDomains()
  for d, _ in pairs(dns2bgpDomainSet) do
    dns2bgpDomains:remove(newDNSName(d))
  end
  dns2bgpDomainSet = {}
  local f = io.open(DNS2BGP_LIST, 'r')
  if not f then
    warnlog('dns2bgp: cannot open ' .. DNS2BGP_LIST)
    return
  end
  local n = 0
  for line in f:lines() do
    local d = line:match('^%s*(.-)%s*$')
    if d and d ~= '' and not d:match('^#') then
      dns2bgpDomains:add(newDNSName(d))
      dns2bgpDomainSet[d] = true
      n = n + 1
    end
  end
  f:close()
  infolog('dns2bgp: loaded ' .. n .. ' suppress domain(s)')
end

function isDns2bgpDomain(dq)
  return dns2bgpDomains:check(dq.qname)
end

reloadDns2bgpDomains()

addAction(
  AndRule({LuaRule(isDns2bgpDomain), QTypeRule(DNSQType.AAAA)}),
  NegativeAndSOAAction(false, 'dns2bgp.', 60, 'ns.dns2bgp.', 'hostmaster.dns2bgp.', 1, 3600, 600, 86400, 60)
)

-- Browsers may learn IPv6 via HTTPS/SVCB ipv6hint and bypass AAAA NODATA.
addAction(
  AndRule({LuaRule(isDns2bgpDomain), QTypeRule(DNSQType.HTTPS)}),
  NegativeAndSOAAction(false, 'dns2bgp.', 60, 'ns.dns2bgp.', 'hostmaster.dns2bgp.', 1, 3600, 600, 86400, 60)
)
addAction(
  AndRule({LuaRule(isDns2bgpDomain), QTypeRule(DNSQType.SVCB)}),
  NegativeAndSOAAction(false, 'dns2bgp.', 60, 'ns.dns2bgp.', 'hostmaster.dns2bgp.', 1, 3600, 600, 86400, 60)
)
