-- dns2bgp AAAA suppress (clients → dnsdist → unbound)
-- Place in front of unbound; clients use dnsdist as resolver.
--
-- dns2bgp writes /var/lib/dns2bgp/aaaa-suppress.domains (one domain per line)
-- and reloads via /usr/lib/dns2bgp/reload-dnsdist.sh (reads /etc/dns2bgp/dnsdist.key).
--
-- Minimal dns2bgp config:
--   ipv6:
--     mode: suppress
--     dnsdist_list_path: "/var/lib/dns2bgp/aaaa-suppress.domains"
--     dnsdist_reload_enable: true
--     dnsdist_console_key_file: "/etc/dns2bgp/dnsdist.key"
--     dnsdist_reload_cmd:
--       - /usr/lib/dns2bgp/reload-dnsdist.sh
--
-- systemd: dns2bgp ExecStartPost and dnsdist ExecReload call the same helper.
--
-- IMPORTANT: SuffixMatchNodeRule() copies the tree at addAction() time.
-- Never use it with a node that reloadDns2bgpDomains() mutates — new/removed
-- names would not apply until dnsdist restart. Use LuaRule + live :check().
--
-- CNAME: AAAA NODATA on the qname is not enough when clients follow CNAME to
-- dualstack.* and query AAAA there (nslookup/host/getaddrinfo). Learn CNAME
-- targets from A answers and suppress those too.

controlSocket('127.0.0.1:5199')
setKey('change-me-to-a-random-base64-key=')  -- dnsdist -k / generateKey()

newServer({address='127.0.0.1:53', name='unbound', pool=''})
addLocal('127.0.0.1:5353')

dns2bgpDomains = newSuffixMatchNode()
dns2bgpDomainSet = {}
local DNS2BGP_LIST = '/var/lib/dns2bgp/aaaa-suppress.domains'

function reloadDns2bgpDomains()
  for d, _ in pairs(dns2bgpDomainSet) do
    dns2bgpDomains:remove(newDNSName(d))
  end
  dns2bgpDomainSet = {}
  local f = io.open(DNS2BGP_LIST, 'r')
  if not f then
    warnlog('dns2bgp: cannot open ' .. DNS2BGP_LIST)
    return
  end
  local n = 0
  for line in f:lines() do
    local d = line:match('^%s*(.-)%s*$')
    if d and d ~= '' and not d:match('^#') then
      dns2bgpDomains:add(newDNSName(d))
      dns2bgpDomainSet[d] = true
      n = n + 1
    end
  end
  f:close()
  infolog('dns2bgp: loaded ' .. n .. ' suppress domain(s)')
end

function isDns2bgpDomain(dq)
  return dns2bgpDomains:check(dq.qname)
end

function dnsNameFromPacket(packet, offset)
  local labels = {}
  local i = offset
  local hops = 0
  while hops < 32 do
    hops = hops + 1
    local b = string.byte(packet, i + 1)
    if b == nil then return nil end
    if b == 0 then break end
    if b >= 192 then
      local b2 = string.byte(packet, i + 2)
      if b2 == nil then return nil end
      local ptr = (b - 192) * 256 + b2
      local rest = dnsNameFromPacket(packet, ptr)
      if rest and rest ~= '' then
        if #labels > 0 then
          return table.concat(labels, '.') .. '.' .. rest
        end
        return rest
      end
      break
    end
    local lab = packet:sub(i + 2, i + 1 + b)
    if #lab ~= b then return nil end
    table.insert(labels, lab)
    i = i + 1 + b
  end
  if #labels == 0 then return nil end
  return table.concat(labels, '.')
end

function learnCnameTargets(dr)
  if not dns2bgpDomains:check(dr.qname) then
    return DNSResponseAction.None
  end
  local ok, err = pcall(function()
    local packet = dr:getContent()
    local overlay = newDNSPacketOverlay(packet)
    for idx = 0, 31 do
      local okRec, rec = pcall(function() return overlay:getRecord(idx) end)
      if not okRec or rec == nil then break end
      -- place 1 == ANSWER
      if rec.type == DNSQType.CNAME and rec.place == 1 then
        local target = dnsNameFromPacket(packet, rec.contentOffset)
        if target and target ~= '' and not dns2bgpDomainSet[target] then
          dns2bgpDomains:add(newDNSName(target))
          dns2bgpDomainSet[target] = true
          infolog('dns2bgp: learned CNAME target ' .. target)
        end
      end
    end
  end)
  if not ok then
    warnlog('dns2bgp: CNAME learn failed: ' .. tostring(err))
  end
  return DNSResponseAction.None
end

reloadDns2bgpDomains()

addAction(
  AndRule({LuaRule(isDns2bgpDomain), QTypeRule(DNSQType.AAAA)}),
  NegativeAndSOAAction(false, 'dns2bgp.', 60, 'ns.dns2bgp.', 'hostmaster.dns2bgp.', 1, 3600, 600, 86400, 60)
)
addAction(
  AndRule({LuaRule(isDns2bgpDomain), QTypeRule(DNSQType.HTTPS)}),
  NegativeAndSOAAction(false, 'dns2bgp.', 60, 'ns.dns2bgp.', 'hostmaster.dns2bgp.', 1, 3600, 600, 86400, 60)
)
addAction(
  AndRule({LuaRule(isDns2bgpDomain), QTypeRule(DNSQType.SVCB)}),
  NegativeAndSOAAction(false, 'dns2bgp.', 60, 'ns.dns2bgp.', 'hostmaster.dns2bgp.', 1, 3600, 600, 86400, 60)
)

addResponseAction(
  AndRule({LuaRule(isDns2bgpDomain), QTypeRule(DNSQType.A)}),
  LuaResponseAction(learnCnameTargets)
)
